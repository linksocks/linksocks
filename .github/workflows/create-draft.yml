name: Create Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag info
        id: tag_info
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "Getting changes since $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            echo "Getting all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          fi
          
          # Save changelog to file
          cat << EOF > changelog.md
          ## What's Changed
          
          $CHANGELOG
          EOF
          
          # Output for use in release
          {
            echo 'CHANGELOG<<EOF'
            cat changelog.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Remove draft releases whose tags are gone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | while read -r tag; do
            [ -n "$tag" ] || continue
            if ! git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              echo "Deleting draft release $tag: its tag no longer exists"
              gh release delete "$tag" --yes
            fi
          done

      # The action looks releases up by tag, and that endpoint never returns a
      # draft, so a draft created by an earlier run for the same tag was left
      # untouched. Find the draft by id and patch it, or create it once.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_info.outputs.tag_name }}"
          RELEASE_ID=$(gh release list --limit 100 --json id,tagName,isDraft \
            --jq ".[] | select(.isDraft and .tagName == \"$TAG\") | .id" | head -1)
          if [ -n "$RELEASE_ID" ]; then
            echo "Updating draft release $RELEASE_ID for $TAG"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name="Release $TAG" \
              -f body="$(cat changelog.md)" > /dev/null
          else
            echo "Creating draft release for $TAG"
            gh release create "$TAG" --draft --title "Release $TAG" --notes-file changelog.md \
              --generate-notes > /dev/null
          fi