name: Publish to PyPI

on:
  release:
    types: [released]  # Only trigger when release is published (not draft)

permissions:
  contents: read

jobs:
  publish-to-pypi:
    name: Publish Python Package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/linksocks
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      actions: read    # list the tag's bindings runs while waiting for their artifacts
      contents: read   # checkout, and run lookups against this repository

    steps:
      - name: Checkout code (for tag context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag commit
        id: tag_commit
        run: |
          echo "sha=$(git rev-list -n 1 ${{ github.event.release.tag_name }})" >> $GITHUB_OUTPUT

      # The wheels and the sdist are built by the tag-triggered "Build Python
      # Bindings" run (workflow file python-tests.yml). Publishing a release
      # right after its tag was pushed raced that build: every download below
      # found nothing and the job failed at "List distributions". Wait for the
      # run of this tag to finish before downloading anything.
      - name: Wait for the bindings build of this tag
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ steps.tag_commit.outputs.sha }}
        run: |
          for i in $(seq 1 60); do
            RESULT=$(gh run list --workflow=python-tests.yml --commit="$SHA" --limit=20 \
              --json status,conclusion,headBranch \
              --jq "[.[] | select(.headBranch == \"$TAG\")][0] | \"\(.status) \(.conclusion)\"")
            echo "Build Python Bindings for $TAG: $RESULT"
            case "$RESULT" in
              "completed success")
                exit 0
                ;;
              completed*)
                echo "::error::Build Python Bindings ended as '$RESULT'; there are no artifacts to publish"
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for Build Python Bindings on $TAG"
          exit 1

      - name: Download combined Linux x64 wheels
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: wheels-linux-x64
          path: dist/
          check_artifacts: false
          if_no_artifact_found: ignore

      - name: Download combined Linux arm64 wheels
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: wheels-linux-arm64
          path: dist/
          check_artifacts: false
          if_no_artifact_found: ignore

      - name: Download Windows wheels
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: wheels-windows-amd64
          path: dist/
          check_artifacts: false
          if_no_artifact_found: ignore

      - name: Download macOS x64 wheels
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: wheels-macos-x64
          path: dist/
          check_artifacts: false
          if_no_artifact_found: ignore

      - name: Download macOS arm64 wheels
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: wheels-macos-arm64
          path: dist/
          check_artifacts: false
          if_no_artifact_found: ignore

      - name: Download source distribution
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: python-tests.yml
          workflow_conclusion: success
          commit: ${{ steps.tag_commit.outputs.sha }}
          name: source-dist
          path: dist/
          check_artifacts: true
          if_no_artifact_found: error

      - name: List distributions
        run: |
          echo "=== Distribution files ==="
          ls -la dist/
          echo "=== Wheel files ==="
          find dist/ -name "*.whl" -exec ls -la {} \;
          echo "=== Source distribution ==="
          find dist/ -name "*.tar.gz" -exec ls -la {} \;

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          verbose: true
          skip-existing: true