name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.md"
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [review_requested]
    paths-ignore:
      - "*.md"

jobs:
  tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Always follow go.mod; no manual bump when Dependabot raises the Go line.
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile="coverage.txt" -covermode=atomic -coverpkg="./linksocks" "./linksocks" "./tests"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.ref, 'refs/heads/dependabot/') }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          fail_ci_if_error: true